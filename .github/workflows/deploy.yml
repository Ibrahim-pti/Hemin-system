name: Deploy to Production Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Contabo VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ــ CSS و JS لێرە دروست دەکرێن، چونکە public/build لە گیتدا نییە ــ
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Verify build output
        run: |
          test -f public/build/manifest.json || { echo "::error::manifest.json نەدۆزرایەوە — بیلدەکە سەرکەوتوو نەبووە"; exit 1; }
          echo "بیلد ئامادەیە:"
          ls -la public/build/assets | head -20

      - name: Pull code and install PHP dependencies
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting automated deployment..."
            cd /www/wwwroot/hemin-system.com

            # Stash any untracked local changes on server to avoid conflicts
            git config --global --add safe.directory /www/wwwroot/hemin-system.com
            git reset --hard HEAD
            git pull origin main

            # Install PHP dependencies without dev packages
            composer install --no-dev --optimize-autoloader --no-interaction

            # Run database migrations
            php artisan migrate --force

            # سڕینەوەی بیلدی کۆن تا فایلە کۆنەکان کۆنەبنەوە
            rm -rf public/build
            mkdir -p public/build

      # ــ ناردنی بیلدی نوێ بۆ سێرڤەر ــ
      - name: Upload built assets
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -e scp -r -P "$SSH_PORT" -o StrictHostKeyChecking=no \
            public/build/. "$SSH_USER@$SSH_HOST:/www/wwwroot/hemin-system.com/public/build/"

      - name: Cache, permissions and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /www/wwwroot/hemin-system.com

            # دڵنیابوونەوە لەوەی بیلدەکە گەیشتووە
            test -f public/build/manifest.json || { echo "❌ manifest.json نەگەیشتووەتە سێرڤەر"; exit 1; }

            # Clear and optimize Laravel caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:clear
            php artisan view:cache

            # Fix directory permissions for Nginx and PHP-FPM
            chown -R www:www /www/wwwroot/hemin-system.com
            chmod -R 775 storage bootstrap/cache

            # Restart PHP-FPM to reload opcache and codebase
            systemctl restart php8.3-fpm
            /etc/init.d/nginx reload

            echo "✅ Deployment completed successfully!"

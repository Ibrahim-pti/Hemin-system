name: Deploy to Production Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Contabo VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build frontend assets directly in CI (automatic cache-busting)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies & Build assets (Vite)
        run: |
          npm ci
          npm run build

      - name: Verify build output
        run: test -f public/build/manifest.json

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting automated deployment..."
            cd /www/wwwroot/hemin-system.com

            # Pick PHP with ext-fileinfo
            PHP="$(command -v php)"
            for cand in $(ls -d /www/server/php/*/bin/php 2>/dev/null | sort -rV); do
              if [ -x "$cand" ] && "$cand" -r 'exit((PHP_VERSION_ID >= 80300 && extension_loaded("fileinfo")) ? 0 : 1);' 2>/dev/null; then
                PHP="$cand"
                break
              fi
            done
            echo "🐘 using $PHP ($("$PHP" -r 'echo PHP_VERSION;'))"

            git config --global --add safe.directory /www/wwwroot/hemin-system.com
            git reset --hard HEAD
            git pull origin main

            # Install PHP dependencies without dev packages
            COMPOSER="$(command -v composer)"
            if ! "$PHP" "$COMPOSER" install --no-dev --optimize-autoloader --no-interaction; then
              echo "⚠️  composer install failed — retrying with the ext-fileinfo check skipped."
              "$PHP" "$COMPOSER" install --no-dev --optimize-autoloader --no-interaction \
                --ignore-platform-req=ext-fileinfo
            fi

            # Run database migrations
            "$PHP" artisan migrate --force

            # Clear and optimize Laravel caches
            "$PHP" artisan config:cache
            "$PHP" artisan route:cache
            "$PHP" artisan view:cache

      # Upload the freshly built assets to the server
      - name: Upload built assets to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "public/build/*"
          target: "/www/wwwroot/hemin-system.com/public/build"
          strip_components: 2
          overwrite: true

      - name: Finalize permissions & Reload services via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /www/wwwroot/hemin-system.com

            # Fix directory permissions for Nginx and PHP-FPM
            chown -R www:www /www/wwwroot/hemin-system.com
            chmod -R 775 storage bootstrap/cache

            # Restart the running PHP-FPM only
            restarted=0
            for svc in php8.3-fpm php8.4-fpm php-fpm-83 php-fpm-84; do
              if systemctl is-active --quiet "$svc"; then
                systemctl restart "$svc"
                echo "♻️  restarted $svc"
                restarted=1
              fi
            done
            [ "$restarted" = "1" ] || echo "⚠️  no running php-fpm service found — restart it manually."

            /etc/init.d/nginx reload

            echo "✅ Deployment completed successfully!"

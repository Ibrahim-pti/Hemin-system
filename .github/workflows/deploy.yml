name: Deploy to Production Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Contabo VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Frontend assets are built here on the runner, not on the VPS ----
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets (Vite)
        run: npm run build

      - name: Verify build output
        run: test -f public/build/manifest.json

      - name: Upload built assets to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "public/build/*"
          target: "/www/wwwroot/hemin-system.com/public/build"
          strip_components: 2
          overwrite: true

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting automated deployment..."
            cd /www/wwwroot/hemin-system.com

            # Stash any untracked local changes on server to avoid conflicts
            git config --global --add safe.directory /www/wwwroot/hemin-system.com
            git reset --hard HEAD
            git pull origin main

            # Install PHP dependencies without dev packages.
            # The server's PHP CLI is missing ext-fileinfo, so fall back to
            # ignoring that platform requirement instead of failing the deploy.
            if ! composer install --no-dev --optimize-autoloader --no-interaction; then
              echo "⚠️  composer install failed — retrying without the ext-fileinfo platform check."
              echo "⚠️  Enable the fileinfo extension for PHP CLI in aaPanel to remove this fallback."
              composer install --no-dev --optimize-autoloader --no-interaction \
                --ignore-platform-req=ext-fileinfo
            fi

            # Run database migrations
            php artisan migrate --force

            # Clear and optimize Laravel caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Fix directory permissions for Nginx and PHP-FPM
            chown -R www:www /www/wwwroot/hemin-system.com
            chmod -R 775 storage bootstrap/cache

            # Restart PHP-FPM to reload opcache and codebase.
            # aaPanel names the unit differently per PHP version, so try each.
            restarted=0
            for svc in php8.3-fpm php8.4-fpm php-fpm-83 php-fpm-84; do
              if systemctl list-unit-files --no-legend "$svc.service" 2>/dev/null | grep -q .; then
                systemctl restart "$svc"
                echo "♻️  restarted $svc"
                restarted=1
              fi
            done
            if [ "$restarted" = "0" ]; then
              echo "⚠️  no php-fpm service matched — restart it manually."
            fi

            if [ -x /etc/init.d/nginx ]; then
              /etc/init.d/nginx reload
            else
              nginx -s reload
            fi

            echo "✅ Deployment completed successfully!"

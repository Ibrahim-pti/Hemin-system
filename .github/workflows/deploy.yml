name: Deploy to Production Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Contabo VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "🚀 Starting automated deployment..."
            cd /www/wwwroot/hemin-system.com

            # Stash any untracked local changes on server to avoid conflicts
            git config --global --add safe.directory /www/wwwroot/hemin-system.com
            git reset --hard HEAD
            git pull origin main

            # Install PHP dependencies without dev packages
            composer install --no-dev --optimize-autoloader --no-interaction

            # Run database migrations
            php artisan migrate --force

            # Clear and optimize Laravel caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Fix directory permissions for Nginx and PHP-FPM
            chown -R www:www /www/wwwroot/hemin-system.com
            chmod -R 775 storage bootstrap/cache

            # Restart PHP-FPM to reload opcache and codebase
            systemctl restart php8.3-fpm
            /etc/init.d/nginx reload

            echo "✅ Deployment completed successfully!"

name: Server check (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect server environment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "== default php =="
            which php; php -r 'echo PHP_VERSION, PHP_EOL;'
            php -r 'echo "fileinfo: ", (extension_loaded("fileinfo") ? "yes" : "no"), PHP_EOL;'

            echo "== installed php versions =="
            ls /www/server/php/ 2>/dev/null
            for d in /www/server/php/*/bin/php; do
              [ -x "$d" ] || continue
              v=$("$d" -r 'echo PHP_VERSION;' 2>/dev/null)
              f=$("$d" -r 'echo extension_loaded("fileinfo") ? "yes" : "no";' 2>/dev/null)
              echo "$d -> $v  fileinfo=$f"
            done

            echo "== active php-fpm =="
            systemctl list-units --type=service --state=running 2>/dev/null | grep -i php || true

            echo "== site php (nginx vhost) =="
            grep -rh "enable-php" /www/server/panel/vhost/nginx/hemin-system.com.conf 2>/dev/null || true

            echo "== composer =="
            which composer; composer -V 2>&1 | head -2

            echo "== node =="
            which node npm 2>/dev/null || echo "node not installed"
            node -v 2>/dev/null || true

            echo "== public/build on server =="
            ls -la /www/wwwroot/hemin-system.com/public/build 2>/dev/null | head -12 || echo "missing"
